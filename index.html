  <title>NiceMon Information and Research Consult</title>

    }

    html {

    body {

    header {

      top: 0;
      z-index: 1000;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-image {
      height: 52px;
      width: auto;
      display: block;
    }

    .logo-text {
      font-size: 30px;
      font-weight: bold;
      color: #0b2f63;
    }

    .logo-text span {
      color: #d4a017;
    }

    nav a {
      margin-left: 18px;
      text-decoration: none;
      color: #0b2f63;
      font-weight: bold;
      font-size: 15px;
    }

    nav a:hover {

    }

    section {

    .hero {

        url("https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1600&q=80");
      background-size: cover;
      background-position: center;
      color: white;
      display: flex;
      align-items: center;
      text-align: center;
    }

    .hero-content {
      max-width: 950px;
      margin: auto;
    }

    .hero h1 {

      margin-bottom: 20px;
    }

    .hero p {
      font-size: 20px;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 30px;
      background: #d4a017;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      margin: 8px;
      border: none;
      cursor: pointer;
    }

    .btn-outline {
      background: transparent;
      border: 2px solid white;
    }

    .btn:hover {
      background: #b8860b;
    }

    h2 {
      text-align: center;
      font-size: 36px;
      margin-bottom: 15px;
      color: #0b2f63;
    }

    .section-subtitle {
      text-align: center;

    .about {

      background-size: cover;
      background-position: center;
      color: white;
    }

    .about h2,
    .about .section-subtitle {
      color: white;
    }

    .content-box {
      max-width: 1000px;
      margin: auto;
      background: rgba(255,255,255,0.12);
      padding: 35px;
      border-radius: 14px;
      backdrop-filter: blur(4px);
      text-align: center;
      font-size: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 25px;
      margin-top: 35px;
    }

    .card {
      background: #ffffff;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.09);
      text-align: center;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-7px);
    }

    .card h3 {
      color: #d4a017;
      margin-bottom: 12px;
    }

    .light {
      background: #f7f9fc;
    }

    .vision-mission {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
    }

    .portfolio-card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 5px 18px rgba(0,0,0,0.09);
    }

    .portfolio-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .portfolio-card div {
      padding: 22px;
    }

    .portfolio-card h3 {
      color: #d4a017;
      margin-bottom: 10px;
    }

    .process {
      background:
        linear-gradient(rgba(0,0,0,0.70), rgba(0,0,0,0.70)),
        url("https://images.unsplash.com/photo-1521791136064-7986c2920216?auto=format&fit=crop&w=1600&q=80");
      background-size: cover;
      background-position: center;
      color: white;
    }

    .process h2,
    .process .section-subtitle {
      color: white;
    }

    .process .card {
      background: rgba(255,255,255,0.95);
      color: #0b2f63;
    }

    .process .card h3 {
      color: #d4a017;
    }

    .process .card p {
      color: #0b2f63;
    }

    .ai-check {
      background: #f9fbff;
      padding: 80px 8%;
    }

    .checker-box {
      max-width: 950px;
      margin: auto;
      background: white;
      border-radius: 18px;
      box-shadow: 0 14px 30px rgba(11,47,99,0.08);
      padding: 35px;
      text-align: left;
    }

    .checker-box h2 {
      margin-bottom: 12px;
    }

    .checker-box textarea {
      width: 100%;
      min-height: 180px;
      padding: 18px;
      border: 1px solid #d9dee7;
      border-radius: 14px;
      font-size: 16px;
      font-family: Arial, sans-serif;
      resize: vertical;
      margin-bottom: 20px;
      color: #0b2f63;
    }

    .checker-box .result-box {
      background: #eef3f8;
      border-radius: 14px;
      padding: 20px;
      margin-top: 18px;
      font-size: 16px;
      color: #0b2f63;
      line-height: 1.65;
    }

    .checker-box .result-box.positive {
      border-left: 5px solid #d4a017;
      background: #fff9e7;
    }

    .checker-box .result-box.negative {
      border-left: 5px solid #0b2f63;
      background: #eaf4ff;
    }

    .ai-check button {
      margin-top: 10px;
    }

    .contact-form-box h3 {
      color: #0b2f63;
    }

    .contact-details p {
      margin-bottom: 22px;

      font-size: 15px;
    }

    .contact-item {
      background: rgba(255,255,255,0.12);

      color: #8a94a6;
    }

    }

      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .submit-btn:hover {
      background: linear-gradient(135deg, #d4a017, #b8860b);
      transform: translateY(-2px);
    }

      color: #6b7280;
      margin-top: 14px;
      text-align: center;
    }
